<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Connectly Login</h1>
            <div class="logo">☀</div>
        </div>
        <div class="login-content">
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-button">Log in</button>
            </form>
 
            <div class="divider">
                <span>OR</span>
            </div>
 
            <button id="google-login" class="google-login-button">
                <div class="google-icon"></div>
                Login with Google
            </button>
 
            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>
        </div>
    </div>
 
    <script>
        // Traditional Email/Password Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
 
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
 
            // Hide previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
 
            try {
                const response = await fetch('/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
 
                const data = await response.json();
 
                if (response.ok) {
                    // Store token and user info
                    localStorage.setItem('token', data.key);
                    localStorage.setItem('user', JSON.stringify(data.user));
 
                    // Show success message
                    successDiv.textContent = 'Login successful! Redirecting...';
                    successDiv.style.display = 'block';
 
                    // Redirect to dashboard or home page
                    setTimeout(() => {
                        window.location.href = '/dashboard/';
                    }, 1500);
                } else {
                    // Show error message
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
 
        // Google OAuth Login
        document.getElementById('google-login').addEventListener('click', async () => {
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
 
            // Hide previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
 
            try {
                // Initialize Google Sign-In (you'll need to include Google's script)
                const googleUser = await new Promise((resolve, reject) => {
                    // This assumes you have Google Sign-In initialized
                    // You'll need to add the Google Sign-In script to your HTML
                    gapi.auth2.getAuthInstance().signIn().then(resolve).catch(reject);
                });
 
                const id_token = googleUser.getAuthResponse().id_token;
 
                const response = await fetch('/auth/google/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        id_token: id_token
                    })
                });
 
                const data = await response.json();
 
                if (response.ok) {
                    // Store token and user info
                    localStorage.setItem('token', data.key);
                    localStorage.setItem('user', JSON.stringify(data.user));
 
                    // Show success message
                    successDiv.textContent = 'Google login successful! Redirecting...';
                    successDiv.style.display = 'block';
 
                    // Redirect to dashboard or home page
                    setTimeout(() => {
                        window.location.href = '/dashboard/';
                    }, 1500);
                } else {
                    // Show error message
                    errorDiv.textContent = data.error || 'Google login failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Google login failed. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
